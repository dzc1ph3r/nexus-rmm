server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug" # debug, release, test
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  host: "localhost"
  port: 5432
  user: "nexus_rmm"
  password: "changeme"
  name: "nexus_rmm"
  ssl_mode: "disable"
  max_connections: 25
  max_idle_connections: 5
  conn_max_lifetime: 300s

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 2

auth:
  jwt_secret: "changeme-use-a-secure-random-secret-in-production"
  jwt_issuer: "nexus-rmm"
  access_token_ttl: 15m
  refresh_token_ttl: 168h # 7 days
  mfa_issuer: "Nexus RMM"
  bcrypt_cost: 12
  max_login_attempts: 5
  lockout_duration: 15m
  password_min_length: 12
  require_mfa: false

remote:
  gateway_host: "0.0.0.0"
  gateway_port: 8443
  websocket_path: "/ws"
  turn_servers: []
  stun_servers: ["stun:stun.l.google.com:19302"]
  ice_servers: []
  max_session_duration: 8h
  session_cleanup_interval: 1h
  recording_enabled: false
  recording_path: "/var/lib/nexus-rmm/recordings"

agent:
  heartbeat_interval: 30s
  missed_heartbeats_threshold: 3
  enrollment_token_ttl: 24h
  max_enrollment_uses: 10
  auto_update_enabled: true
  update_check_interval: 1h
  command_timeout: 5m
  file_transfer_chunk_size: 1048576 # 1MB
  max_concurrent_tasks: 5

monitoring:
  metrics_interval: 60s
  retention_period: 30d
  alert_evaluation_interval: 30s
  notification_batch_size: 100
  max_alerts_per_device: 1000

automation:
  max_concurrent_jobs: 10
  job_timeout: 30m
  retry_attempts: 3
  retry_delay: 5m
  schedule_precision: 1m

notification:
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_user: ""
    smtp_password: ""
    from_address: "noreply@nexus-rmm.local"
    from_name: "Nexus RMM"
    use_tls: true
  webhook:
    enabled: false
    default_timeout: 10s
    max_retries: 3
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, console
  output: "stdout"
  file_path: "/var/log/nexus-rmm/server.log"
  max_size: 100 # MB
  max_backups: 7
  max_age: 30 # days
  compress: true

tls:
  cert_file: ""
  key_file: ""
  ca_file: ""
  auto_cert: false
  auto_cert_domains: []
  auto_cert_email: ""
  auto_cert_cache: "/var/lib/nexus-rmm/certs"

license:
  enabled: true
  license_server_url: ""
  public_key: ""
  grace_period: 7d
  check_interval: 24h

audit:
  enabled: true
  retention_period: 365d
  batch_size: 100
  flush_interval: 5s