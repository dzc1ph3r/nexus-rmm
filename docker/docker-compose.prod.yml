services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nexus-rmm-postgres
    environment:
      POSTGRES_USER: nexus_rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus_rmm
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_rmm -d nexus_rmm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache & Messaging
  redis:
    image: redis:7-alpine
    container_name: nexus-rmm-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend API Server
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: nexus-rmm-backend
    env_file:
      - .env
    environment:
      CONFIG_FILE: /app/config.yaml
      GIN_MODE: release
      NEXUS_DATABASE_HOST: postgres
      NEXUS_DATABASE_PORT: 5432
      NEXUS_DATABASE_USER: nexus_rmm
      NEXUS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      NEXUS_DATABASE_NAME: nexus_rmm
      NEXUS_DATABASE_SSL_MODE: disable
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PORT: 6379
      NEXUS_REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEXUS_AUTH_JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Remote Access Gateway (WebRTC Signaling)
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: nexus-rmm-gateway
    env_file:
      - .env
    environment:
      CONFIG_FILE: /app/config.yaml
      GIN_MODE: release
      NEXUS_DATABASE_HOST: postgres
      NEXUS_DATABASE_PORT: 5432
      NEXUS_DATABASE_USER: nexus_rmm
      NEXUS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      NEXUS_DATABASE_NAME: nexus_rmm
      NEXUS_DATABASE_SSL_MODE: disable
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PORT: 6379
      NEXUS_REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEXUS_AUTH_JWT_SECRET: ${JWT_SECRET}
    volumes:
      - recordings:/var/lib/nexus-rmm/recordings
    expose:
      - "8443"
    depends_on:
      backend:
        condition: service_started
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "--spider", "http://localhost:8443/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Frontend (served via Nginx with SSL termination)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: nexus-rmm-frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
      gateway:
        condition: service_started
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: nexus-rmm-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - nexus-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  recordings:

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
