services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nexus-rmm-postgres
    environment:
      POSTGRES_USER: nexus_rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: nexus_rmm
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_rmm -d nexus_rmm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network
    restart: unless-stopped

  # Redis Cache & Messaging
  redis:
    image: redis:7-alpine
    container_name: nexus-rmm-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network
    restart: unless-stopped

  # Backend API Server
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: nexus-rmm-backend
    environment:
      CONFIG_FILE: /app/config.yaml
      GIN_MODE: release
    volumes:
      - ../backend/config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexus-network
    restart: unless-stopped

  # Remote Access Gateway (WebRTC Signaling)
  gateway:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.gateway
    container_name: nexus-rmm-gateway
    environment:
      CONFIG_FILE: /app/config.yaml
      GIN_MODE: release
    volumes:
      - ../backend/config.yaml:/app/config.yaml:ro
      - recordings:/var/lib/nexus-rmm/recordings
    ports:
      - "8443:8443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexus-network
    restart: unless-stopped

  # Frontend (served via Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: nexus-rmm-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexus-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  recordings:

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16